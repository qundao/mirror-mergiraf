---
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  outdated:
    runs-on: ubuntu-with-rust-1.91
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-outdated
        run: cargo binstall cargo-outdated --version 0.19.0
      - name: Check outdated dependencies
        run: helpers/check-outdated.py --fail-noncompat --fail-deprecated
